# brenon-console — Swarm contract (issues #4, #26).
#
# This file is versioned intent, not an apply.
# Do not Portainer PUT this git file when live env is masked (***).
# CD happy path: GHCR publish then POST Portainer webhook (secret
# PORTAINER_WEBHOOK_CONSOLE). Not docker save / ForceUpdate.
# Public hostname + tunnel + CNAME are #5 (do not PUT tunnel here).
#
# Image: ghcr.io/brenonaraujo/home-cloud-console:${CONSOLE_IMAGE_TAG}
# Pin CONSOLE_IMAGE_TAG to vX.Y.Z or sha-<git> in Portainer env.
# `latest` is not the production contract.
#
# Networks: overlay by name. No 192.168.x / host IP as the first option.
# Published port: bound on the node that runs the task (mode: host). This is the
# documented fallback, taken on 2026-11-22: the ingress mesh (VIP) on server102
# drops TCP segments sent alone with 1149-1398 bytes of payload (IP 1201-1450),
# so ~1 kB responses vanish and the JS bundle stalls mid-download (blank console
# after a release until the CDN holds a full copy). Same node, mode: host: fine.
# Ingress on home101: fine. Details and the one-line test in README.md.
# Go back to ingress only after that node's mesh is repaired.
# The tunnel origin is therefore <node that runs the task>:18082 — still no
# machine address in this file.

version: "3.9"

services:
  console:
    image: ghcr.io/brenonaraujo/home-cloud-console:${CONSOLE_IMAGE_TAG:-dev}
    networks:
      - console
    ports:
      - target: 8080
        published: 18082
        protocol: tcp
        mode: host
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.labels.vserver == true
      resources:
        limits:
          memory: 64M
          cpus: "0.25"
        reservations:
          memory: 16M
          cpus: "0.05"
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 60s
      update_config:
        parallelism: 1
        # stop-first: with a host port the new task cannot bind 18082 while the
        # old one still holds it. A release is a few seconds of 502 at the origin.
        order: stop-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: stop-first
      labels:
        - "home.cloud.app=console"
        - "traefik.enable=false"

networks:
  console:
    driver: overlay
    attachable: true
