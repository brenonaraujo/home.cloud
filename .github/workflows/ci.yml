name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write

# Sensors before any GHCR publish (release.yml). Failure is visible on the run.

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: required contracts exist
        run: |
          test -f SPEC.md
          test -f ARCHITECTURE.md
          test -f harness/PROJECT.md
          test -f harness/personas/domain-expert-home-cloud.md
          test -f docs/adr/0001-i18n-en-pt.md
          test -f docs/adr/0002-vue-vite-swarm.md
      - name: mermaid fences in architecture docs
        run: |
          test "$(grep -c '```mermaid' ARCHITECTURE.md)" -ge 1
          test "$(grep -c '```mermaid' docs/taxonomy.md)" -ge 1

  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/console/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  # Image job after unit/build. Independent of `contracts`.
  spa-nginx:
    runs-on: ubuntu-latest
    needs: [console]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build console image from platform/spa-nginx
        run: |
          docker build -f platform/spa-nginx/Dockerfile \
            --build-context spa=apps/console \
            -t home-cloud-console:ci \
            platform/spa-nginx
      - name: Smoke health, shell HTML, SPA fallback
        run: bash platform/spa-nginx/smoke.sh --skip-build --image home-cloud-console:ci --port 18082
      - name: Trivy image scan (block CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: home-cloud-console:ci
          format: table
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true
      - name: Trivy SARIF
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: home-cloud-console:ci
          format: sarif
          output: trivy-console.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'
      - name: Upload Trivy SARIF
        if: always() && hashFiles('trivy-console.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-console.sarif
